<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14555c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quest Island">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="supabase.js"></script>
</head>
<body>
<title>Quest Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: one-screen tablet app on a sea-teal "island map" ground; sand cards hold every task. Single deliberate theme. */
:root{
  --sea:#14555c; --sea-deep:#0c3d43; --foam:#9fd8e0;
  --sand:#fbf0d9; --sand-2:#f1dcb0; --white:#fffaf0;
  --ink:#1f2a30; --ink-soft:#5d6b6c;
  --coral:#ef6447; --sun:#ffc23d; --leaf:#3a9e66; --plum:#7650b0;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Comic Neue","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-size:18px;
  background-image:radial-gradient(circle at 15% 20%,rgba(159,216,224,.18) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(159,216,224,.14) 0 2px,transparent 3px);
  background-size:46px 46px,62px 62px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{max-width:1000px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:16px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.card{background:var(--sand);border-radius:22px;box-shadow:0 6px 0 var(--sea-deep)}
.btn{font-family:var(--display);font-size:22px;padding:14px 24px;border-radius:16px;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #c58c0f;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c58c0f}
.btn.ghost{background:var(--sand-2);box-shadow:0 5px 0 #c9ad78}
.topbar{display:flex;align-items:center;gap:12px;color:var(--white);margin-bottom:16px;flex-wrap:wrap}
.topbar h1{font-size:30px;flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sea-deep);color:var(--white);padding:8px 14px;border-radius:999px;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.back{background:var(--sea-deep);color:var(--white);width:48px;height:48px;border-radius:14px;font-size:26px;display:grid;place-items:center}
.muted{color:var(--ink-soft)}
.small{font-size:15px}

/* profiles */
.hero{color:var(--white);text-align:center;padding:24px 0 8px}
.hero h1{font-size:clamp(44px,8vw,72px);line-height:1;color:var(--sun);text-shadow:0 4px 0 var(--sea-deep)}
.hero p{margin:10px auto 0;max-width:34ch;color:var(--foam)}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:28px}
.kid{padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.kid .av{width:110px;height:110px}
.kid h2{font-size:32px}
.foot{margin-top:auto;padding-top:24px;display:flex;justify-content:center}
.linkbtn{color:var(--foam);font-size:16px;text-decoration:underline;padding:10px}

/* hub */
.portals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.portal{padding:20px;display:flex;gap:16px;align-items:center;text-align:left;border-radius:22px;color:var(--white);box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s;min-height:130px}
.portal:active{transform:translateY(4px)}
.portal svg{width:72px;height:72px;flex:none}
.portal h2{font-size:28px;line-height:1.05}
.portal p{margin:4px 0 0;font-size:16px;opacity:.92}
.p-maths{background:var(--coral)} .p-reason{background:var(--plum)} .p-blitz{background:#d9881a} .p-vault{background:var(--leaf)}
.hubrow{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}
.goal{padding:18px 20px}
.bar{height:16px;border-radius:999px;background:var(--sand-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .4s}
.den-btn{padding:16px;display:flex;align-items:center;gap:12px;text-align:left}
.den-btn svg{width:56px;height:56px;flex:none}
@media (max-width:640px){.portals,.hubrow{grid-template-columns:1fr}.portal{min-height:100px}}

/* game */
.trail{display:flex;align-items:center;gap:6px;margin-bottom:16px}
.stone{flex:1;height:14px;border-radius:999px;background:var(--sea-deep);position:relative;transition:background .3s}
.stone.done{background:var(--sun)} .stone.miss{background:var(--foam)}
.stone.boss{flex:1.6;height:22px;background:#5a3b7a}
.stone.boss.done{background:var(--sun)}
.stone.now::after{content:"";position:absolute;inset:-6px;border:3px solid var(--white);border-radius:999px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.locks{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.lock{width:52px;height:60px}
.lock .shackle{transition:transform .4s}
.lock.open .shackle{transform:translateY(-10px) rotate(-18deg);transform-origin:38px 26px}
.lock.open .body{fill:var(--sun)}
.qcard{padding:28px clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:20px;position:relative;flex:1}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-soft)}
.tag.boss{color:var(--plum)}
.q{font-size:clamp(24px,3.6vw,36px);line-height:1.35;font-weight:700;max-width:30ch;text-wrap:pretty}
.q.big{font-size:clamp(34px,6vw,56px);font-family:var(--display);font-weight:400;max-width:none;letter-spacing:.02em}
.q b.w{background:var(--sand-2);padding:0 8px;border-radius:8px}
.box{display:inline-block;width:1.4em;height:1.05em;border:4px dashed var(--coral);border-radius:10px;vertical-align:-.12em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.8em;line-height:1;margin:0 3px}
.fr b:first-child{border-bottom:3px solid currentColor;padding:0 4px 2px}
.fr b:last-child{padding-top:2px}
.seq{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,48px);letter-spacing:.04em}
.sentence{font-size:clamp(26px,4vw,38px);background:var(--white);padding:14px 18px;border-radius:14px;display:inline-block;letter-spacing:.02em}
.abc{display:flex;flex-wrap:wrap;gap:3px;font-family:var(--display);font-size:16px;color:var(--ink-soft)}
.abc span{width:24px;text-align:center;background:var(--sand-2);border-radius:5px;padding:2px 0}
.clock{width:min(220px,50vw);height:auto;display:block}
.clock .face{fill:var(--white);stroke:var(--ink);stroke-width:4}
.clock text{fill:var(--ink);font-family:var(--display);font-size:13px}
.clock .hh{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.clock .mh{stroke:var(--coral);stroke-width:4;stroke-linecap:round}
.clock .hub{fill:var(--ink)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:auto}
.choice{background:var(--white);border:4px solid var(--sand-2);border-radius:18px;padding:18px 14px;font-size:clamp(22px,3vw,30px);font-weight:700;min-height:76px;transition:transform .08s,border-color .15s}
.choice:active{transform:scale(.97)}
.choice.right{border-color:var(--leaf);background:#dff3e6}
.choice.wrong{border-color:var(--coral);background:#fde3dc}
.entry{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:auto}
.display{min-width:200px;text-align:center;font-family:var(--display);font-size:46px;background:var(--white);border-radius:16px;padding:6px 20px;border:4px solid var(--sand-2);min-height:76px;font-variant-numeric:tabular-nums}
.display .unit{font-size:28px;color:var(--ink-soft);margin-left:4px}
.display.right{border-color:var(--leaf)} .display.wrong{border-color:var(--coral)}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:10px}
.key{height:66px;border-radius:16px;background:var(--white);font-family:var(--display);font-size:30px;box-shadow:0 4px 0 var(--sand-2)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sand-2)}
.key.go{background:var(--leaf);color:var(--white);box-shadow:0 4px 0 #23704a}
.key.del{background:var(--sand-2)}
.fb{position:absolute;left:16px;right:16px;bottom:16px;border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;animation:rise .25s ease-out}
.fb.good{background:var(--leaf);color:var(--white)}
.fb.bad{background:var(--ink);color:var(--white)}
.fb h3{font-size:28px}
.fb p{margin:4px 0 0;font-size:18px;max-width:52ch}
.fb .txt{flex:1;min-width:0}
@keyframes rise{from{transform:translateY(20px);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* blitz */
.timer{height:20px;border-radius:999px;background:var(--sea-deep);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--sun);transition:width .1s linear}
.combo{font-family:var(--display);font-size:24px;color:var(--coral)}

/* results */
.res{padding:32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.stars{display:flex;gap:10px}
.stars svg{width:70px;height:70px}
.res h2{font-size:42px}
.ups{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.ups li{background:var(--white);border-radius:12px;padding:8px 14px;font-weight:700}

/* den */
.den{padding:24px;display:flex;flex-direction:column;gap:20px}
.hatch{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.egg{width:110px;height:130px}
.egg.wobble{animation:wob .5s 3}
@keyframes wob{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.crit{background:var(--white);border-radius:16px;padding:12px;text-align:center}
.crit svg{width:90px;height:90px}
.crit b{display:block;font-family:var(--display);font-weight:400;font-size:20px}
.crit .r{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.crit .r.rare{color:var(--plum)} .crit .r.legendary{color:#c0791a}
.newcrit{animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* grown-ups */
.gate{padding:28px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.gate input{font:inherit;font-size:24px;padding:12px 16px;border-radius:14px;border:3px solid var(--sand-2);background:var(--white);color:var(--ink);width:min(340px,100%);text-align:center;user-select:text;-webkit-user-select:text}
.parent input{user-select:text;-webkit-user-select:text}
.parent{display:flex;flex-direction:column;gap:18px}
.pcard{padding:22px;display:flex;flex-direction:column;gap:14px}
.prow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.prow input,.prow select{font:inherit;font-size:18px;padding:8px 12px;border-radius:10px;border:2px solid var(--sand-2);background:var(--white);color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px;min-width:520px}
th{text-align:left;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);padding:6px 8px;border-bottom:2px solid var(--sand-2)}
td{padding:8px;border-bottom:1px solid var(--sand-2);font-variant-numeric:tabular-nums}
.pips{display:inline-flex;gap:3px}
.pips i{width:14px;height:14px;border-radius:4px;background:var(--sand-2)}
.pips i.on{background:var(--leaf)}
.secth{font-family:var(--display);font-size:18px;color:var(--plum);padding-top:14px}
.confirm{background:var(--white);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{color:var(--foam);font-size:15px;max-width:70ch}
/* metacognition + growth */
.fb.ask{background:var(--white);border:4px solid var(--sun);color:var(--ink)}
.confs{display:flex;gap:10px;flex-wrap:wrap}
.conf{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sand);border-radius:14px;padding:10px 14px;font-weight:700;font-size:16px;min-width:96px}
.conf svg{width:44px;height:44px}
.conf:active{transform:scale(.96)}
.choice.picked{border-color:var(--sun);background:#fff2cc}
.hubrow{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))!important}
.mm{text-align:left;border:4px solid var(--plum)}
.tree{display:flex;align-items:center;gap:12px}
.tree svg{width:72px;height:72px;flex:none}
.reflect{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(620px,100%)}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.rgrid .choice{font-size:18px;min-height:60px;padding:10px}
@media (max-width:520px){.rgrid{grid-template-columns:1fr}}
/* rewards */
.rwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.rw{padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:4px solid transparent}
.rw svg{width:56px;height:56px}
.rw b{font-size:17px;line-height:1.2}
.rw.sel{border-color:var(--sun)}
.rw .pill{font-size:16px;padding:4px 10px}
.ricon svg{width:62px;height:62px;display:block}
.rwlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px 18px}
.rwrow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--sand-2);padding:4px 0;font-size:16px}
.rwrow select{font:inherit;font-size:14px;padding:4px 6px;border-radius:8px;border:2px solid var(--sand-2);background:var(--white);color:var(--ink)}
.bonus{display:inline-block;background:var(--sun);color:var(--ink);font-family:var(--body);font-weight:700;font-size:13px;padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
/* balance */
.balance{display:flex;flex-direction:column;gap:6px;background:var(--white);border-radius:14px;padding:14px 16px}
.bsub{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);margin-top:8px}
.brow{display:grid;grid-template-columns:minmax(120px,170px) 1fr minmax(90px,auto);gap:10px;align-items:center;font-size:15px}
.bbar{height:12px;background:var(--sand-2);border-radius:999px;overflow:hidden}
.bbar i{display:block;height:100%;background:var(--leaf);border-radius:999px;min-width:2px}
.brow.low .bbar i{background:var(--coral)} .brow.low .bl{color:var(--coral);font-weight:700}
.bv{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:14px;text-align:right}
.bcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 24px}
.seg{display:inline-flex;background:var(--sand-2);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--white)}
/* memory match */
.mstage{background:var(--sea-deep)}
.mgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:10px;padding:12px}
.mcard{position:relative;border-radius:14px;perspective:600px}
.mcard span{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s}
.mcard .back{background:var(--plum);border:4px solid var(--white)}
.mcard .face{background:var(--white);transform:rotateY(180deg);font-family:var(--display);color:var(--ink);padding:4px;text-align:center;display:flex!important;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.mcard .face svg{height:72%;width:auto;max-width:100%}
.mcard .cap{font-size:clamp(12px,1.8vw,18px);line-height:1}
.mcard .num{font-size:clamp(28px,5vw,52px)}
.mcard .word{font-size:clamp(18px,3vw,32px)}
.mcard .face svg{height:72%;width:auto;max-width:100%}
.mcard .face small{font-family:var(--body);font-size:11px;color:var(--ink-soft)}
.mnum{font-size:clamp(28px,5vw,48px);font-weight:400}
.mword{font-weight:400;font-size:clamp(14px,2.2vw,20px)}
.mword.big{font-size:clamp(20px,3.4vw,32px)}
.mcard.up .back{transform:rotateY(180deg)} .mcard.up .face{transform:rotateY(360deg)}
.mcard.got .face{background:#dff3e6;border:4px solid var(--leaf)}
@media (max-width:560px){.brow{grid-template-columns:110px 1fr 70px;font-size:13px}}
/* big goal */
.biggoal{padding:16px 20px;display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.biggoal svg{width:62px;height:76px;flex:none}
.biggoal .txt{flex:1;min-width:200px}
.biggoal h2{font-size:24px}
.biggoal .bar{height:22px}
.biggoal .bar i{background:linear-gradient(90deg,var(--sun),var(--coral))}
.biggoal.won{background:var(--sun);animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 6px 0 var(--sea-deep),0 0 0 8px rgba(255,194,61,.35)}}
.goalnote{background:var(--sun);border-radius:14px;padding:12px 16px;font-weight:700;max-width:46ch}
/* arcade */
.p-arcade{grid-column:1/-1;background:var(--sea-deep);border:4px solid var(--sun);min-height:100px}
.arc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.arc .card{padding:20px;display:flex;flex-direction:column;gap:10px}
.arc svg{width:100%;height:auto;border-radius:14px}
.arc h2{font-size:26px}
@media (max-width:760px){.arc{grid-template-columns:1fr}}
.stagewrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.stage{position:relative;width:min(100%,calc((100vh - 230px)*1.6));aspect-ratio:8/5;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 var(--sea-deep);touch-action:none}
.stage canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(12,61,67,.82);color:var(--white);text-align:center;padding:20px}
.ov h2{font-size:clamp(28px,5vw,44px);color:var(--sun)}
.ov p{margin:0;max-width:40ch;font-size:19px}
.ov .q{color:var(--white)}
.ov .choices{width:min(520px,100%);grid-template-columns:repeat(3,minmax(0,1fr))}
.ov .choice{color:var(--ink)}
.ctrls{display:flex;gap:14px}
.ctrls .btn{min-width:130px;touch-action:none}
.bbqc{flex-wrap:wrap;justify-content:center}.bbqc .btn{min-width:0;font-size:18px;padding:12px 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
/* ---------- helpers ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B='<span class="box"></span>';
const F=(n,d)=>`<span class="fr"><b>${n}</b><b>${d}</b></span>`;
const W=w=>`<b class="w">${w}</b>`;

  const ex=c.eyes===1?[50]:c.eyes===2?[40,60]:[34,50,66];ex.forEach(x=>s+=`<circle cx="${x}" cy="50" r="8" fill="#fffaf0"/><circle cx="${x+1}" cy="51" r="4" fill="#1f2a30"/>`);
  s+=`<path d="M42 64 Q50 70 58 64" stroke="#1f2a30" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if(c.rar==='legendary')s+=`<path d="M84 14l2 5 5 2-5 2-2 5-2-5-5-2 5-2z M14 20l1.5 3.5 3.5 1.5-3.5 1.5L14 30l-1.5-3.5L9 25l3.5-1.5z" fill="#ffc23d"/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${s}</svg>`}

function vHub(){stopBlitz();stopArcade();const t=todayKey(),n=K.today.d===t?K.today.n:0,goal=20;
  app.innerHTML=`${topbar(esc(K.name),`<span class="pill">${ICON.flame}${K.streak} day${K.streak===1?'':'s'}</span><span class="pill">${ICON.token}${K.tokens}</span>${gemPill()}`,'profiles')}

  <div class="portals">

    <button class="portal p-vault" data-act="play" data-arg="vault">${ICON.vault}<div><h2>Code Vault</h2>${bonusBadge('vault')}<p>Crack six locks with letter puzzles.</p></div></button>

    <div class="card goal tree">${treeSVG(treeStage(K.grow))}<div><div class="disp" style="font-size:22px">Growth Tree</div><div class="muted small">${TREE[treeStage(K.grow)][0]} · ${treeStage(K.grow)<TREE.length-1?`${TREE[treeStage(K.grow)+1][1]-K.grow} growth to the next stage`:'fully grown!'}</div></div></div>
    <div class="card goal"><div class="disp" style="font-size:22px">Today's goal</div><div class="muted small">${Math.min(n,goal)} of ${goal} questions${n>=goal?' · goal reached!':''}</div><div class="bar"><i style="width:${Math.min(100,n/goal*100)}%"></i></div><div class="muted small" style="margin-top:8px">Best Speed Blitz: ${K.best}</div></div>

  </div>`}

/* Growth tree: grows from effort, honest self-checks and fixed mistakes, never from raw speed or scores */
const TREE=[['Seed',0],['Sprout',8],['Sapling',20],['Young tree',40],['Big tree',70],['Blossom tree',110],['Fruit tree',160]];
const treeStage=g=>{let s=0;TREE.forEach((t,i)=>{if(g>=t[1])s=i});return s};
function treeSVG(s){let o=`<svg viewBox="0 0 80 80" aria-hidden="true"><ellipse cx="40" cy="72" rx="26" ry="6" fill="#c9ad78"/>`;
  if(s===0)return o+`<ellipse cx="40" cy="66" rx="7" ry="5" fill="#8a6a4a"/></svg>`;
  const h=[0,14,24,34,40,44,46][s],w=[0,2,3,5,6,7,7][s];o+=`<rect x="${40-w/2}" y="${70-h}" width="${w}" height="${h}" rx="2" fill="#8a6a4a"/>`;
  if(s===1)return o+`<path d="M40 58 q-10 -8 -12 -2 q6 6 12 2z M40 56 q10 -10 13 -3 q-6 6 -13 3z" fill="#3a9e66"/></svg>`;
  const r=[0,0,12,17,21,24,25][s];o+=`<circle cx="40" cy="${70-h}" r="${r}" fill="#3a9e66"/><circle cx="${40-r*.6}" cy="${70-h+r*.3}" r="${r*.6}" fill="#349159"/><circle cx="${40+r*.6}" cy="${70-h+r*.3}" r="${r*.6}" fill="#2f8a52"/>`;
  if(s>=5)[[-10,-6],[8,-10],[12,4],[-14,6],[0,-16]].forEach(([dx,dy])=>o+=`<circle cx="${40+dx}" cy="${70-h+dy}" r="3" fill="${s===6?'#ef6447':'#fbd3e0'}"/>`);
  return o+'</svg>'}
function grow(n){K.grow+=n}

/* quest, vault and memory mission */
function startGame(mode){const conf={maths:{pool:MATHS,n:10,title:'Number Quest'},reason:{pool:VR,n:10,title:'Brain Quest'},vault:{pool:['codes','letters','analogy','compound'],n:6,title:'Code Vault'}}[mode];
  G={mode,...conf,i:0,res:[],gems:0,ups:[],last:null,used:[],growth:0,misses:{},t0:Date.now()};nextQ()}
/* Retrieval practice: a short mixed round pulled from memory. Missed questions come back first (exactly as asked before),
   then skills that are due for spaced review, interleaved across maths and reasoning. */
function startReview(){const list=[];
  dueReviews().slice(0,4).forEach(r=>list.push({...r.q,id:r.id,lv:r.lv,flash:r}));
  const seen=Object.keys(SK).filter(id=>K.skills[id]&&K.skills[id].n>0);
  const order=shuffle(seen).sort((a,b)=>(K.skills[a].due||0)-(K.skills[b].due||0));
  let j=0;while(list.length<6){const id=order.length?order[j++%order.length]:pick(Object.keys(SK)),lv=sk(K,id).lvl;list.push({...SK[id].g(lv),id,lv,recall:1})}
  G={mode:'review',title:'Memory Mission',n:6,list:shuffle(list),i:0,res:[],gems:0,ups:[],used:[],growth:0,misses:{},t0:Date.now()};nextQ()}
function nextQ(){if(G.i>=G.n)return finish();
  if(G.mode==='review')G.q=G.list[G.i];
  else{const boss=G.mode!=='vault'&&G.i===G.n-1,due=dueReviews().filter(r=>G.pool.includes(r.id)&&!G.used.includes(r));
    if(!boss&&due.length&&Math.random()<.3){const r=due[0];G.used.push(r);G.q={...r.q,id:r.id,lv:r.lv,flash:r}}
    else{const id=pickSkill(K,G.pool,G.last),base=sk(K,id).lvl,lv=boss?Math.min(5,base+1):base;G.last=id;G.q={...SK[id].g(lv),id,lv,boss}}}
  G.input='';G.done=false;G.revealed=false;vGame()}
function progress(){if(G.mode==='vault')return `<div class="locks">${Array.from({length:G.n},(_,i)=>lockSVG(G.res[i]===1)).join('')}</div>`;
  return `<div class="trail">${Array.from({length:G.n},(_,i)=>`<span class="stone${i===G.n-1&&G.mode!=='review'?' boss':''}${G.res[i]===1?' done':G.res[i]===0?' miss':''}${i===G.i?' now':''}"></span>`).join('')}</div>`}
function vGame(){const Q=G.q;
  let ans='';
  if(Q.type==='num')ans=`<div class="entry"><div class="display" id="disp">${G.input||'&nbsp;'}${Q.unit?`<span class="unit">${Q.unit}</span>`:''}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="key" data-act="key" data-arg="${d}">${d}</button>`).join('')}<button class="key del" data-act="key" data-arg="del" aria-label="Delete">⌫</button><button class="key" data-act="key" data-arg="0">0</button><button class="key go" data-act="key" data-arg="go" aria-label="Check">✓</button></div></div>`;
  else ans=`<div class="choices">${Q.choices.map(c=>`<button class="choice" data-act="choose" data-arg="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  const tag=Q.boss?'Boss question · 3 gems':Q.flash?'Flashback · a question you missed before':Q.recall?`Remember? · ${SK[Q.id].n}`:SK[Q.id].n;
  app.innerHTML=`${topbar(G.title,gemPill())}${progress()}
  <div class="card qcard" id="qc"><div class="qmeta"><span class="tag${Q.boss||Q.flash?' boss':''}">${tag}</span><span class="tag">${G.i+1} / ${G.n}</span></div>
  ${Q.lead?`<div class="muted" style="font-size:20px;font-weight:700">${Q.lead}</div>`:''}
  ${Q.visual||''}<div class="q${Q.big?' big':''}">${Q.prompt}</div>
  ${Q.abc?`<div class="abc">${AZ.split('').map(c=>`<span>${c}</span>`).join('')}</div>`:''}
  ${ans}</div>`}

/* Metacognition: after choosing, the child says how sure they are before seeing whether they were right */
const FACE=m=>`<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#ffc23d" stroke="#1f2a30" stroke-width="2.5"/><circle cx="14" cy="16" r="2.5" fill="#1f2a30"/><circle cx="26" cy="16" r="2.5" fill="#1f2a30"/><path d="${['M13 27 Q20 24 27 27','M13 26 H27','M12 24 Q20 32 28 24'][m]}" stroke="#1f2a30" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
const CONF=['Guessing','I think so','Sure!'];
function answer(given,btn){if(G.done)return;G.done=true;G.given=given;G.btn=btn;
  if(btn)btn.classList.add('picked');
  if(!K.askConf)return reveal(-1);
  const fb=document.createElement('div');fb.className='fb ask';fb.id='askfb';
  fb.innerHTML=`<div class="txt"><h3>How sure are you?</h3></div><div class="confs">${CONF.map((c,i)=>`<button class="conf" data-act="conf" data-arg="${i}">${FACE(i)}<span>${c}</span></button>`).join('')}</div>`;
  document.getElementById('qc').appendChild(fb)}
function reveal(conf){if(G.revealed)return;G.revealed=true;const af=document.getElementById('askfb');if(af)af.remove();
  const Q=G.q,ok=G.given===Q.answer,now=Date.now();let notes=[],gr=0;
  /* skill record (spacing + adaptive level) */
  const ch=record(K,Q.id,ok);tick(K);logSkill(Q.id);if(ch===1)G.ups.push(`${SK[Q.id].n} → Level ${sk(K,Q.id).lvl}`);
  /* mistake box (spaced retrieval of the exact question) */
  if(Q.flash){const r=Q.flash;if(ok){r.box++;if(r.box>=BOX_GAP.length){K.review=K.review.filter(x=>x!==r);K.fixed++;gr+=3;notes.push('Mistake fixed for good! +3 growth')}else{r.due=now+BOX_GAP[r.box];gr+=1;notes.push('You remembered! +1 growth')}}
    else{r.box=0;r.due=now+BOX_GAP[0];notes.push('This one will come back soon.')}}
  else if(!ok){const {id,lv,boss,flash,recall,...keep}=Q;K.review.push({id:Q.id,lv:Q.lv,q:keep,box:0,due:now+BOX_GAP[0]});if(K.review.length>40)K.review.shift();notes.push('Saved for a Flashback later.')}
  /* comeback: getting a skill right after missing it earlier in this game */
  if(ok&&G.misses[Q.id]){gr+=1;notes.push('Comeback! +1 growth');G.misses[Q.id]=0}if(!ok)G.misses[Q.id]=1;
  if(Q.boss)gr+=1;
  /* calibration */
  let head;
  if(conf>=0){const m=K.meta,key=['g','t','s'][conf]+(ok?'R':'W');m[key]++;
    if(ok)head=conf===2?'Sure and right!':conf===1?'You were right! Trust yourself.':'You knew more than you thought!';
    else{head=conf===2?'Not yet! You felt sure: slow down and check next time.':'Not yet! Good self-check, you knew it was tricky.';if(conf<2){gr+=1;notes.push('Honest self-check +1 growth')}}}
  else head=ok?pick(['Brilliant!','Spot on!','Great thinking!']):'Not yet!';
  if(gr){grow(gr);G.growth+=gr}
  G.res[G.i]=ok?1:0;const earn=ok?(Q.boss?3:G.mode==='review'?2:1):0;G.gems+=earn;earn_(earn);save();beep(ok);
  const btn=G.btn;if(btn){btn.classList.remove('picked');btn.classList.add(ok?'right':'wrong');if(!ok)document.querySelectorAll('.choice').forEach(b=>{if(b.dataset.arg===Q.answer)b.classList.add('right')})}
  const disp=document.getElementById('disp');if(disp)disp.classList.add(ok?'right':'wrong');
  const qc=document.getElementById('qc');if(!ok)qc.classList.add('shake');
  const fb=document.createElement('div');fb.className='fb '+(ok?'good':'bad');
  fb.innerHTML=ok?`<div class="txt"><h3>${head}</h3><p>+${earn} gem${earn>1?'s':''}${notes.length?' · '+notes.join(' · '):''}</p></div>`
    :`<div class="txt"><h3>${head}</h3><p><b>The answer is ${esc(Q.answer)}${Q.unit?esc(Q.unit):''}.</b> ${Q.explain}</p>${notes.length?`<p class="small">${notes.join(' · ')} Mistakes help your brain grow.</p>`:''}</div><button class="btn" data-act="next">Next</button>`;
  qc.appendChild(fb);
  if(G.mode==='vault'&&ok){const locks=document.querySelectorAll('.lock');locks[G.i]&&locks[G.i].classList.add('open')}
  if(ok)setTimeout(()=>{if(G&&G.revealed&&G.res[G.i]===1){G.i++;nextQ()}},notes.length?1900:1200)}
function finish(){const right=G.res.filter(x=>x).length,stars=right>=G.n*.9?3:right>=G.n*.7?2:1;let bonus=0;
  if(G.mode==='vault'&&right===G.n){bonus=5;earn_(5)}
  K.tokens++;streak(K);logSession(G.mode,Date.now()-G.t0);bonus+=claimBonus(G.mode);save();
  const title=G.mode==='vault'?(right===G.n?'Vault cracked!':'Vault closed… for now'):G.mode==='review'?(right>=5?'Super memory!':'Memory getting stronger!'):stars===3?'Island conquered!':stars===2?'Great expedition!':'Good effort, explorer!';
  vResult(title,stars,`${right} of ${G.n} correct · +${G.gems+bonus} gems${bonus?` (incl. ${bonus} bonus)`:''} · +1 arcade token${G.growth?` · +${G.growth} growth`:''}`,G.ups,G.mode==='review'?'review':'play',G.mode,true)}
const REFL=['I took my time','I checked my answer','I used what I already know','I kept trying when it was hard'];
function vResult(title,stars,line,ups,act,arg,reflect){const g=K.goal;
  app.innerHTML=`${topbar('Results',`<span class="pill">${ICON.token}${K.tokens}</span>${gemPill()}`)}<div class="card res"><div class="stars">${[1,2,3].map(i=>star(i<=stars)).join('')}</div><h2>${title}</h2><p class="muted" style="font-size:20px;margin:0">${line}</p>
  ${ups&&ups.length?`<div class="disp" style="font-size:20px;color:var(--leaf)">Levelled up!</div><ul class="ups">${ups.map(u=>`<li>${esc(u)}</li>`).join('')}</ul>`:''}
  ${reflect?`<div class="reflect" id="refl"><div class="disp" style="font-size:22px">What helped you most today?</div><div class="rgrid">${REFL.map((r,i)=>`<button class="choice" data-act="reflect" data-arg="${i}">${r}</button>`).join('')}</div></div>`:''}
  ${!g?`<div class="small muted">Choose a big goal on the island. You have ${K.gp} gems saved towards it.</div>`:goalWon()?`<div class="goalnote">Big goal reached! Show a grown-up: you've earned: ${esc(g.label)}.</div>`:`<div style="width:min(420px,100%)"><div class="small muted">${esc(g.label)}: ${goalTarget(K)-K.gp} gems to go</div><div class="bar"><i style="width:${K.gp/goalTarget(K)*100}%;background:var(--sun)"></i></div></div>`}
  <div class="prow" style="justify-content:center"><button class="btn" data-act="${act}" data-arg="${arg||''}">Play again</button><button class="btn ghost" data-act="home">Back to island</button>${K.gems>=20?`<button class="btn ghost" data-act="den">Hatch an egg</button>`:''}</div></div>`}

/* blitz */
function blitzQ(){const t=sk(K,'times').lvl,a=sk(K,'add_sub').lvl;return Math.random()<.65?gTimes(Math.max(2,t)):gAddSub(Math.min(2,a))}
function startBlitz(){stopBlitz();G={mode:'blitz',score:0,combo:0,left:60,q:blitzQ(),input:'',correct:0,t0:Date.now()};vBlitz();const t0=Date.now();
  blitzTimer=setInterval(()=>{G.left=Math.max(0,60-(Date.now()-t0)/1000);const bar=document.getElementById('tbar');if(bar)bar.style.width=(G.left/60*100)+'%';if(G.left<=0)endBlitz()},100)}
function stopBlitz(){if(blitzTimer){clearInterval(blitzTimer);blitzTimer=null}}
function vBlitz(){const mult=G.combo>=6?3:G.combo>=3?2:1;
  app.innerHTML=`${topbar('Speed Blitz',`<span class="pill">Score ${G.score}</span>`)}<div class="timer"><i id="tbar" style="width:${G.left/60*100}%"></i></div>
  <div class="card qcard" id="qc"><div class="qmeta"><span class="tag">Quick-fire</span><span class="combo">${mult>1?`Combo ×${mult}`:'&nbsp;'}</span></div>
  <div class="q big">${G.q.prompt}</div><div class="entry"><div class="display" id="disp">${G.input||'&nbsp;'}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="key" data-act="key" data-arg="${d}">${d}</button>`).join('')}<button class="key del" data-act="key" data-arg="del" aria-label="Delete">⌫</button><button class="key" data-act="key" data-arg="0">0</button><button class="key go" data-act="key" data-arg="go" aria-label="Check">✓</button></div></div></div>`}
function blitzAnswer(){if(!G.input)return;const ok=G.input===G.q.answer;beep(ok);
  if(ok){G.combo++;G.correct++;G.score+=G.combo>=6?3:G.combo>=3?2:1;tick(K)}else{G.combo=0}
  const d=document.getElementById('disp');d.classList.add(ok?'right':'wrong');if(!ok){d.innerHTML=G.q.answer;document.getElementById('qc').classList.add('shake')}
  setTimeout(()=>{if(G&&G.mode==='blitz'&&G.left>0){G.q=blitzQ();G.input='';vBlitz()}},ok?250:900)}
function endBlitz(){stopBlitz();const earn=Math.ceil(G.score/4),best=G.score>K.best;if(best)K.best=G.score;earn_(earn);K.tokens++;streak(K);logSession('blitz',Date.now()-G.t0);const bon=claimBonus('blitz');save();
  vResult(best?'New best score!':'Time!',G.score>=30?3:G.score>=15?2:1,`Score ${G.score} · ${G.correct} correct · +${earn+bon} gems${bon?' (incl. 5 bonus)':''} · +1 arcade token`,[],'blitz')}

/* den */
function vDen(fresh){app.innerHTML=`${topbar('Creature Den',gemPill())}<div class="card den">
  <div class="hatch"><svg class="egg" id="egg" viewBox="0 0 110 130"><ellipse cx="55" cy="70" rx="44" ry="56" fill="#fffaf0" stroke="#1f2a30" stroke-width="4"/><circle cx="40" cy="58" r="9" fill="#ef6447"/><circle cx="70" cy="86" r="11" fill="#7650b0"/><circle cx="72" cy="48" r="6" fill="#3a9e66"/><circle cx="38" cy="96" r="6" fill="#ffc23d"/></svg>
  <div style="flex:1;min-width:200px"><h2 style="font-size:30px">Hatch a creature</h2><p class="muted" style="margin:6px 0 12px">Each egg costs 20 gems. Some creatures are rare. A few are legendary.</p>
  <button class="btn" data-act="hatch" ${K.gems<20?'disabled style="opacity:.5"':''}>${K.gems<20?`Need ${20-K.gems} more gems`:'Hatch egg (20 gems)'}</button></div></div>
  <div class="coll">${K.creatures.length?K.creatures.slice().reverse().map((c,i)=>`<div class="crit${fresh&&i===0?' newcrit':''}">${critSVG(c)}<b>${esc(c.name)}</b><span class="r ${c.rar}">${c.rar}</span></div>`).join(''):`<p class="muted">No creatures yet. Win gems in any game to hatch your first.</p>`}</div></div>`}
function hatch(){if(K.gems<20)return;K.gems-=20;const egg=document.getElementById('egg');egg.classList.add('wobble');beep(true);
  setTimeout(()=>{K.creatures.push(newCreature());save();vDen(true)},1500)}

/* ---------- arcade ---------- */

const MODES=[['maths','Number Quest'],['reason','Brain Quest'],['review','Memory Mission'],['blitz','Speed Blitz'],['vault','Code Vault'],['arcade','Arcade']];
function lastDays(n){const out=[];for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);out.push(todayKey(d))}return out}
function logSession(mode,ms){const k=K;k.log.push({d:todayKey(),m:mode,t:Math.round(ms/1000)});if(k.log.length>800)k.log.splice(0,k.log.length-800);
  const t=k.tot[mode]||(k.tot[mode]={n:0,s:0});t.n++;t.s+=Math.round(ms/1000)}
function logSkill(id){const d=todayKey(),m=K.daily[d]||(K.daily[d]={});m[id]=(m[id]||0)+1;
  const keep=new Set(lastDays(60));Object.keys(K.daily).forEach(x=>{if(!keep.has(x))delete K.daily[x]})}
function weekModes(k){const days=new Set(lastDays(7)),o={};MODES.forEach(([m])=>o[m]={n:0,s:0});k.log.forEach(e=>{if(days.has(e.d)&&o[e.m]){o[e.m].n++;o[e.m].s+=e.t}});return o}

/* merge per child: the more recently updated copy wins; matches by id, or by name for a fresh device */
function mergeRemote(R){if(!R||!Array.isArray(R.kids))return;
  R.kids.forEach(rk=>{const byId=S.kids.find(k=>k.id===rk.id),lk=byId||S.kids.find(k=>k.name.toLowerCase()===rk.name.toLowerCase()&&!R.kids.some(x=>x.id===k.id));
    if(!lk){S.kids.push(upgrade(rk));return}
    /* same id: newest copy wins. Same name on a new device: the family's cloud copy wins */
    if(!byId||(rk.updatedAt||0)>(lk.updatedAt||0)){for(const key of Object.keys(lk))delete lk[key];Object.assign(lk,rk);upgrade(lk)}});
  if((R.famUpdated||0)>(S.famUpdated||0)){S.rewards=R.rewards||S.rewards;if(R.pwHash)S.pwHash=R.pwHash;S.famUpdated=R.famUpdated}}

/* Basketball Shoot */
function playBasket(){const E=arcShell('Basketball Shoot'),{ctx,ov}=E;AR={alive:true,off:[]};arcT0=Date.now();
  const st={q:0,score:0,Q:null,hoops:[],ball:{x:400,y:430,s:1},shot:null,clock:0,msg:'',msgT:0,run:false,down:null,res:[]};
  function next(){if(st.q>=10)return end();st.q++;st.Q=mixQ();const v=shuffle([st.Q.ans,...st.Q.wrong.slice(0,2)]);
    st.hoops=v.map((t,i)=>({bx:200+i*200,x:200+i*200,t}));st.ball={x:400,y:430,s:1};st.shot=null;st.clock=600}
  function end(){st.run=false;arcEnd(st.score>=8?'All-star shooter!':st.score>=5?'Nice shooting!':'Keep practising!',`${st.score} of 10 baskets`,st.score+1,st.score>=8?3:st.score>=5?2:1,'basket')}
  listen(E.cv,'pointerdown',e=>{if(!st.run||st.shot)return;st.down=E.pt(e)});
  listen(E.cv,'pointerup',e=>{if(!st.run||st.shot||!st.down)return;const p=E.pt(e),dx=p.x-st.down.x,dy=p.y-st.down.y;st.down=null;
    if(dy>-25){st.msg='Swipe upwards to shoot!';st.msgT=60;return}const tx=400+dx*(310/-dy)*.9;st.shot={tx,t:0}});
  intro(ov,'basket',()=>{st.run=true;next()});
  loop(()=>{if(st.run){if(st.q>3)st.hoops.forEach((h,i)=>h.x=h.bx+Math.sin(performance.now()/700+i*2)*(st.q>6?70:40));
      if(!st.shot&&--st.clock<=0){st.res.push(0);st.msg=`Time! It was ${st.Q.ans}`;st.msgT=80;beep(false);next()}
      if(st.shot){const s=st.shot;s.t++;const f=Math.min(1,s.t/34);st.ball.x=400+(s.tx-400)*f;st.ball.y=430-310*f-Math.sin(f*Math.PI)*90;st.ball.s=1-f*.45;

/* Mountain Cycle: pedal left-right in rhythm, refuel with questions at energy stations, beat the rival */
function playCycle(){arcT0=Date.now();const E=arcShell('Mountain Cycle',`<div class="ctrls"><button class="btn" id="pl">◀ Left pedal</button><button class="btn" id="pr">Right pedal ▶</button></div>`),{ctx,ov}=E;AR={alive:true,off:[]};
  const LEN=16000,STATIONS=[4000,8000,12000],ground=x=>360-38*Math.sin(x/900)-24*Math.sin(x/370+1)+10*Math.sin(x/130),slope=x=>(ground(x+5)-ground(x-5))/10;

    ov.innerHTML=`<p>Energy station ${st.stIdx} of 3</p><div class="q big">${esc(Q.text)}</div><div class="choices">${ch.map(c=>`<button class="choice" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
    ov.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(!st.paused)return;const ok=b.dataset.v===Q.ans;beep(ok);b.classList.add(ok?'right':'wrong');
      if(ok){st.right++;st.e=100;st.boost=180;st.msg='Full energy + turbo!'}else{st.e=Math.min(100,st.e+35);st.msg=`It was ${Q.ans}. A little energy`}st.msgT=90;E.score.textContent=`${st.right} right`;
      setTimeout(()=>{if(!AR)return;ov.hidden=true;st.paused=false},ok?450:1200)})}
  function end(){st.run=false;const won=st.won===true;arcEnd(won?'Mountain champion!':'You made it to the top!',`${won?'Beat the rival':'Rival finished first'} · ${st.right} of 3 stations right`,st.right+(won?3:1),won&&st.right>=2?3:won||st.right>=2?2:1,'cycle')}
  const pl=document.getElementById('pl'),pr=document.getElementById('pr');

  function bike(x,y,col,spin,lean){ctx.save();ctx.translate(x,y);ctx.rotate(lean);ctx.strokeStyle='#1f2a30';ctx.lineWidth=3;

    ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(-4,-20);ctx.lineTo(16,-20);ctx.lineTo(22,0);ctx.moveTo(-4,-20);ctx.lineTo(2,0);ctx.lineTo(-22,0);ctx.stroke();

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('qi-salt:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

  const f=document.getElementById('gateform'),inp=document.getElementById('gpw');

        <label><input type="checkbox" data-chg="conf" data-arg="${ki}" ${k.askConf?'checked':''}> Ask "How sure are you?" after each answer</label></div>`})()}
      <div class="tablewrap"><table><thead><tr><th>Skill</th><th>Level</th><th>Accuracy</th><th>Tried</th></tr></thead><tbody>${block(k,ki,MATHS,'Maths')}${block(k,ki,VR,'Verbal reasoning')}</tbody></table></div>
      ${confirmReset===ki?`<div class="confirm"><b>Reset all of ${esc(k.name)}'s progress and creatures?</b><button class="btn" data-act="doreset" data-arg="${ki}">Yes, reset</button><button class="btn ghost" data-act="noreset">Keep</button></div>`:`<div><button class="linkbtn" style="color:var(--coral)" data-act="askreset" data-arg="${ki}">Reset progress</button></div>`}
    </div>`}).join('')}
  <p class="note">Levels are a rough guide. Level 3 aims at the 7+ entry standard for selective London schools, level 4 at 8+, level 5 stretches towards 11+ reasoning. A skill moves up after 4 right in a row and down after 2 misses in 3. <b>Spacing:</b> a skill answered correctly is due again after ½ to 7 days, depending on level, and due skills come up far more often. Missed questions return as Flashbacks after 10 minutes, 1 day, 3 days and 7 days, and graduate once remembered at every step. <b>Retrieval:</b> Memory Mission mixes those Flashbacks with due skills across maths and reasoning. <b>Self-check accuracy</b> counts "sure" answers that were right plus "guessing / think so" answers that were wrong, so it measures how well they know what they know. ${window.supabase?'Progress syncs across devices when cloud sync is signed in.':'This test copy saves progress on this device only.'}</p></div>`;paintAuth();const pf=document.getElementById('pwform');if(pf)pf.onsubmit=savePw}
function rewardsCard(){return `<div class="card pcard"><div class="secth" style="padding:0">Reward menu</div><p class="small muted" style="margin:0">Tick the rewards you're happy to give. Each child picks their own goal from the ticked ones.</p>
  <div class="rwlist">${S.rewards.map((r,i)=>`<div class="rwrow"><label><input type="checkbox" data-chg="rwon" data-arg="${i}" ${r.on?'checked':''}> ${esc(r.label)}</label><select data-chg="rwtier" data-arg="${i}" aria-label="Tier for ${esc(r.label)}"><option value="small" ${r.tier==='small'?'selected':''}>Small treat</option><option value="big" ${r.tier==='big'?'selected':''}>Save up</option></select></div>`).join('')}</div>
  <div class="prow"><input id="rwnew" placeholder="Add your own reward" maxlength="40" style="flex:1;min-width:200px"><select id="rwnewtier"><option value="small">Small treat</option><option value="big">Save up</option></select><button class="btn ghost" data-act="rwadd">Add</button></div></div>`}

/* ---------- events ---------- */
const ACT={
  profiles:vProfiles,
  home:()=>{stopBlitz();stopArcade();G=null;K?vHub():vProfiles()},
  kid:i=>{K=S.kids[+i];vHub()},
  play:m=>startGame(m), blitz:startBlitz, den:()=>vDen(false), hatch, review:startReview,
  arcade:vArcade,
  arcplay:g=>{G=null;stopArcade();if(K.tokens<1)return vArcade();K.tokens--;save();({penalty:playPenalty,invaders:playInvaders,dash:playDash,basket:playBasket,fruit:playFruit,race:playRace,match:playMatch,bbq:playBBQ,cycle:playCycle})[g]()},
  conf:c=>reveal(+c),
  reflect:i=>{K.refl[+i]++;grow(1);save();const r=document.getElementById('refl');if(r)r.innerHTML=`<div class="goalnote" style="background:var(--leaf);color:var(--white)">Great reflecting! Knowing what helps you is a superpower. +1 growth</div>`},
  given:i=>{const k=S.kids[+i];k.gp=0;k.goal=null;k.updatedAt=Date.now();saveLocal();queueSync();vParent()},
  goalpick:vGoalPick,
  pickgoal:id=>{const r=S.rewards.find(x=>x.id===id);if(!r)return;K.goal={label:r.label,tier:r.tier};save();vHub()},
  balview:v=>{balView=v;vParent()},
  rwadd:()=>{const el=document.getElementById('rwnew'),v=el.value.trim();if(!v)return;S.rewards.push({id:'c'+Date.now().toString(36),label:v,tier:document.getElementById('rwnewtier').value,cat:'star',on:true});S.famUpdated=Date.now();saveLocal();queueSync();vParent()},
  sbsave:()=>{const url=document.getElementById('sburl').value.trim(),key=document.getElementById('sbkey').value.trim();try{localStorage.setItem('qi-sync',JSON.stringify({url,key}))}catch(e){}SB=null;vParent()},
  signin:async()=>{const c=sb();if(!c)return;const email=document.getElementById('sbemail').value.trim(),password=document.getElementById('sbpass').value;syncMsg='Signing in…';document.getElementById('syncline').innerHTML=syncLine();
    const {error}=await c.auth.signInWithPassword({email,password});syncMsg=error?'Sign-in failed: '+error.message:'';await syncNow();vParent()},
  signout:async()=>{const c=sb();if(c)await c.auth.signOut();vParent()},
  syncnow:async()=>{await syncNow();vParent()},
  token:i=>{S.kids[+i].tokens++;save();vParent()},
  next:()=>{G.i++;nextQ()},
  choose:(v,b)=>answer(v,b),
  key:k=>{if(!G)return;if(G.mode!=='blitz'&&G.q&&G.q.type==='choice')return;if(k==='go'){if(G.mode==='blitz')return blitzAnswer();if(G.mode==='gate'){if(G.input===gateAns)vParent();else{G.input='';const d=document.getElementById('disp');d.innerHTML='&nbsp;';d.classList.add('wrong')}return}if(G.input)answer(G.input);return}
    if(G.done)return;if(k==='del')G.input=G.input.slice(0,-1);else if(G.input.length<5)G.input=(G.input+k).replace(/^0+(?=\d)/,'');
    const d=document.getElementById('disp');if(d){d.classList.remove('wrong','right');d.innerHTML=(G.input||'&nbsp;')+(G.q&&G.q.unit?`<span class="unit">${G.q.unit}</span>`:'')}},
  gate:vGate,
  sound:()=>{S.sound=!S.sound;save();vParent()},
  askreset:i=>{confirmReset=+i;vParent()}, noreset:()=>{confirmReset=null;vParent()},
  doreset:i=>{const k=S.kids[+i];Object.assign(k,{gems:15,tokens:2,streak:0,lastDay:null,today:{d:null,n:0},best:0,creatures:[],skills:{},review:[],grow:0,fixed:0,meta:null,refl:null,gp:0,log:[],tot:{},daily:{},bonusDay:{},updatedAt:Date.now()});upgrade(k);confirmReset=null;save();vParent()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;ACT[b.dataset.act]&&ACT[b.dataset.act](b.dataset.arg,b)});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.chg;if(!c)return;
  if(c==='rwon'||c==='rwtier'){const r=S.rewards[+t.dataset.arg];if(c==='rwon')r.on=t.checked;else r.tier=t.value;S.famUpdated=Date.now();saveLocal();queueSync();return}
  const k=S.kids[+t.dataset.arg];if(!k)return;
  if(c==='name')k.name=t.value.trim()||k.name;if(c==='year')k.year=+t.value;
  if(c==='costsmall')k.costs.small=+t.value;if(c==='costbig')k.costs.big=+t.value;
  if(c==='conf')k.askConf=t.checked;if(c==='nudge')k.nudge=t.checked;
  k.updatedAt=Date.now();saveLocal();queueSync();if(c==='costsmall'||c==='costbig'||c==='nudge')vParent()});
document.addEventListener('keydown',e=>{if(!G||e.target.tagName==='INPUT')return;
  if(G.done&&!G.revealed&&document.getElementById('askfb')&&/^[1-3]$/.test(e.key))return reveal(+e.key-1);
  if(/^[0-9]$/.test(e.key))ACT.key(e.key);else if(e.key==='Backspace')ACT.key('del');else if(e.key==='Enter'){if(G.done&&document.querySelector('[data-act="next"]'))ACT.next();else ACT.key('go')}
  else if(G.q&&G.q.type==='choice'&&/^[1-4]$/.test(e.key)){}});
S=load();
vProfiles();
/* sync on open, when coming back to the app, and when the connection returns */
async function bootSync(){if(!sb())return;await syncNow();if(!K&&document.querySelector('.kids'))vProfiles()}
bootSync();window.addEventListener('online',syncNow);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')bootSync()});
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
